<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>微知 · 碎片阅读</title>
<meta name="theme-color" content="#3D8A5A">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
<meta name="apple-mobile-web-app-title" content="微知">
<style>
  :root {
    --bg: #F5F4F1;
    --card: #ffffff;
    --primary: #3D8A5A;
    --primary-dark: #2f6d47;
    --accent: #D89575;
    --accent-soft: #f7e8e0;
    --text: #2b2b28;
    --text-2: #6b6a64;
    --text-3: #9a9890;
    --line: #ece9e2;
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 2px 14px rgba(0,0,0,.06);
    --shadow-lg: 0 8px 28px rgba(0,0,0,.10);
    --green-soft: #e7f2ec;
    --red: #c94f4f;
    --red-soft: #f9e8e8;
    --amber: #b9851f;
    --amber-soft: #f6edda;
    --blue: #3d6f8a;
    --blue-soft: #e3eef3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Outfit", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  a { color: var(--primary); text-decoration: none; }

  /* ---------- 顶部壳 ---------- */
  .shell {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    position: relative;
    background: var(--bg);
  }
  @media (min-width: 421px) {
    .shell {
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(245,244,241,.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand-name { display: flex; align-items: center; gap: 9px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), #55a476);
    color: #fff; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0;
  }
  .brand-title { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .brand-sub { font-size: 11px; color: var(--text-3); margin-top: -2px; }
  .back-btn {
    border: none; background: var(--card); color: var(--text);
    width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow);
    font-size: 18px; line-height: 1;
  }
  .back-btn:hover { background: #f0efe9; }

  /* 日期筛选 */
  /* 日历式日期选择器（含打卡热力色）——默认收起，点按钮弹出 */
  .date-scroll { padding: 4px 0; }
  .date-trigger { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: border-color .15s; }
  .date-trigger:hover { border-color: var(--primary); }
  .cal-panel { margin-top: 8px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 6px; }
  .cal-month { font-weight: 700; font-size: 14px; }
  .cal-nav { border: 1px solid var(--line); background: var(--bg); width: 30px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text); }
  .cal-nav:hover { border-color: var(--primary); }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 4px 4px; color: var(--text-3); font-size: 11px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 4px; }
  .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; background: var(--bg); font-size: 13px; cursor: pointer; color: var(--text-2); position: relative; }
  .cal-day.empty { background: transparent; cursor: default; color: var(--text-3); }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--blue); }
  .cal-day.active { background: var(--primary); color: #fff; }
  .cal-day.has-1 { background: #E8F4ED; }     /* 浅绿 1-3 张 */
  .cal-day.has-2 { background: #BFE0CC; }     /* 中绿 4-9 张 */
  .cal-day.has-3 { background: #7CC597; color: #fff; }  /* 深绿 ≥10 张 */
  .cal-day:hover:not(.empty):not(.active) { background: var(--card); }
  .cal-num { font-size: 9px; opacity: 0.75; margin-top: 1px; }

  /* 学习统计 */
  .stat-bar { display: flex; gap: 14px; margin-bottom: 12px; }
  .stat-item {
    font-size: 12px; color: var(--text-2); font-weight: 600;
    background: var(--card); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 999px;
  }
  .stat-item b { color: var(--primary); font-size: 13px; margin: 0 1px; }

  /* 新建知识 */
  .create-btn {
    width: 100%; border: 1.5px dashed var(--primary); border-radius: var(--radius);
    background: var(--green-soft); color: var(--primary-dark);
    font-size: 14px; font-weight: 700; padding: 13px;
    cursor: pointer; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s ease;
  }
  .create-btn:hover { background: #dcefe4; }
  .create-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(43,43,40,.4); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .create-box {
    width: 100%; max-width: 380px; background: var(--card);
    border-radius: var(--radius); box-shadow: var(--shadow-lg);
    padding: 20px;
    animation: fadeIn .2s ease;
    max-height: calc(100vh - 48px); overflow-y: auto; /* 内容超长时弹窗内部可滚，按钮不被挤出 */
  }
  .create-box-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .create-hint { font-size: 12px; color: var(--text-3); margin-bottom: 12px; }
  .create-box textarea {
    width: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 12px; font-size: 14px; line-height: 1.6; font-family: inherit; resize: vertical;
    color: var(--text); background: #fff; box-sizing: border-box;
  }
  .create-box textarea:focus { outline: none; border-color: var(--primary); }
  .create-submit {
    width: 100%; margin-top: 12px; border: none; border-radius: var(--radius-sm);
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 700;
    padding: 13px; cursor: pointer;
  }
  .create-footer { position: sticky; bottom: 0; background: var(--card); padding: 8px 0 0; margin-top: 12px; border-top: 1px solid var(--line); }
  .create-submit:disabled { opacity: .6; cursor: not-allowed; }
  .create-cancel {
    width: 100%; margin-top: 8px; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-3); font-size: 13px; font-weight: 600;
    padding: 8px; cursor: pointer;
  }
  .create-msg { font-size: 13px; margin-top: 10px; line-height: 1.5; }
  .create-msg.err { color: var(--red); }
  .create-msg.ok { color: var(--primary); }

  /* 已读徽章 */
  .done-badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 700; color: var(--primary-dark);
    background: var(--green-soft); border: 1px solid #cfe6d8;
    padding: 3px 9px; border-radius: 999px; letter-spacing: .3px;
  }
  .card.done { box-shadow: 0 2px 10px rgba(61,138,90,.12); }
  .card.done .card-title { color: var(--text-2); }

  /* ---------- 内容区 ---------- */
  .content { padding: 16px 16px 40px; }
  .view { display: none; }
  .view.active { display: block; }

  .hint { text-align: center; color: var(--text-3); font-size: 13px; padding: 60px 0; }
  .count-line { font-size: 12px; color: var(--text-3); margin: 2px 2px 12px; }

  /* ---------- 列表卡片 ---------- */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:active { transform: scale(.985); box-shadow: var(--shadow-lg); }
  .card-title { font-size: 16.5px; font-weight: 700; line-height: 1.45; margin-bottom: 7px; }
  .card-summary { font-size: 13.5px; color: var(--text-2); line-height: 1.6; margin-bottom: 13px; }
  .card-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    letter-spacing: .3px;
  }
  .badge-cat { background: var(--accent-soft); color: #b06a49; }
  .badge-diff-入门 { background: var(--green-soft); color: var(--primary-dark); }
  .badge-diff-中级 { background: var(--amber-soft); color: var(--amber); }
  .badge-diff-高级 { background: var(--red-soft); color: var(--red); }
  .badge-diff-其他 { background: var(--blue-soft); color: var(--blue); }
  .meta-source { font-size: 12px; color: var(--text-3); margin-left: auto; }
  .card-arrow { color: var(--text-3); font-size: 13px; margin-left: 2px; }

  /* ---------- 详情 ---------- */
  .detail-head { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 18px; margin-bottom: 14px; }
  .detail-title { font-size: 20px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
  .detail-summary { font-size: 14px; color: var(--text-2); line-height: 1.65; margin-bottom: 14px; }
  .detail-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .section { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--text);
  }
  .section-title::before {
    content: ""; width: 4px; height: 16px; border-radius: 2px;
    background: var(--primary);
  }
  .body-text p { font-size: 15px; line-height: 1.85; color: #3a3a35; margin-bottom: 14px; }
  .body-text p:last-child { margin-bottom: 0; }
  .body-text .body-heading { font-weight: 700; font-size: 15.5px; color: var(--text); margin-top: 4px; }

  .core-point { display: flex; gap: 10px; margin-bottom: 12px; }
  .core-point:last-child { margin-bottom: 0; }
  .core-num {
    flex: 0 0 22px; height: 22px; border-radius: 7px;
    background: var(--green-soft); color: var(--primary-dark);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .core-text { font-size: 14px; color: #3a3a35; line-height: 1.65; padding-top: 1px; }

  .think-box {
    background: linear-gradient(135deg, var(--accent-soft), #fbf1ec);
    border: 1px solid #efd9cb;
    border-radius: var(--radius-sm);
    padding: 14px 15px; font-size: 14px; line-height: 1.7;
  }
  .think-label { font-weight: 700; color: #b06a49; font-size: 13px; margin-bottom: 6px; display: block; }
  .code-block { background: #f4f1ec; border: 1px solid #e5e0d8; border-radius: 10px; padding: 12px 14px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.6; overflow-x: auto; white-space: pre; }
  .think-answer-btn { margin-top: 10px; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
  .think-answer { margin-top: 10px; background: #f4faf5; border-left: 3px solid var(--accent); padding: 12px 14px; border-radius: 6px; font-size: 14px; line-height: 1.7; color: #3a3a35; }

  /* 翻卡视图里的随堂小测 */
  .task-quiz-item { margin-top: 12px; }
  .task-quiz-q { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .task-quiz-opts { display: flex; flex-direction: column; gap: 6px; }
  .task-opt { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; cursor: pointer; }
  .task-opt:disabled { cursor: default; }
  .task-opt-correct { background: #eef7ef; border-color: #7fc89a; color: #2c7a4b; }
  .task-opt-wrong { background: #fbeeea; border-color: #e8a896; color: #b5563c; }
  .task-quiz-explain { margin-top: 8px; font-size: 13px; color: #6b645a; background: #faf7f2; border-radius: 8px; padding: 8px 12px; }

  .links { display: flex; flex-direction: column; gap: 10px; }
  .link-item {
    display: flex; align-items: center; gap: 9px;
    padding: 12px 14px; border-radius: var(--radius-sm);
    background: #faf9f6; border: 1px solid var(--line);
    font-size: 13.5px; font-weight: 600; color: var(--text);
    transition: background .12s ease;
  }
  .link-item:hover { background: #f0efe9; }
  .link-item .ic { color: var(--primary); font-size: 15px; }
  .link-item .arrow-out { margin-left: auto; color: var(--text-3); font-size: 13px; }
  .link-item .url { font-weight: 400; color: var(--text-3); font-size: 12px; margin-left: auto; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Quiz ---------- */
  .quiz-toggle {
    width: 100%; border: none; border-radius: var(--radius);
    background: var(--primary); color: #fff;
    font-size: 15px; font-weight: 700; padding: 15px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(61,138,90,.3);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s ease;
    margin-bottom: 14px;
  }
  .quiz-toggle:hover { background: var(--primary-dark); }
  .quiz-panel { display: none; }
  .quiz-panel.open { display: block; }
  .quiz-progress { font-size: 12px; color: var(--text-3); margin-bottom: 10px; font-weight: 600; }
  .quiz-bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 16px; }
  .quiz-bar-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s ease; }
  .quiz-question { font-size: 15.5px; font-weight: 700; line-height: 1.55; margin-bottom: 16px; }
  .option {
    display: flex; align-items: flex-start; gap: 10px;
    width: 100%; text-align: left;
    padding: 13px 14px; margin-bottom: 10px;
    border-radius: var(--radius-sm); border: 1.5px solid var(--line);
    background: #fcfbf9; cursor: pointer; font-size: 14px; line-height: 1.55;
    transition: all .12s ease; color: var(--text);
  }
  .option:hover { border-color: #d6d3c9; }
  .option .key {
    flex: 0 0 22px; height: 22px; border-radius: 7px;
    background: #f0efe9; color: var(--text-2);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .option.correct { border-color: var(--primary); background: var(--green-soft); }
  .option.correct .key { background: var(--primary); color: #fff; }
  .option.wrong { border-color: var(--red); background: var(--red-soft); }
  .option.wrong .key { background: var(--red); color: #fff; }
  .option.disabled { pointer-events: none; opacity: .72; }
  .option.muted { opacity: .55; }
  .explain {
    margin: 4px 0 16px; padding: 12px 14px;
    background: #f6f4ee; border-left: 3px solid var(--primary);
    border-radius: 8px; font-size: 13px; line-height: 1.65; color: #4c4b45;
    animation: fadeIn .25s ease;
  }
  .explain .ex-label { font-weight: 700; color: var(--primary-dark); }
  .explain.wrong-ex { border-left-color: var(--red); }
  .explain.wrong-ex .ex-label { color: var(--red); }
  .quiz-next {
    width: 100%; border: none; border-radius: var(--radius-sm);
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 700;
    padding: 13px; cursor: pointer; display: none;
  }
  .quiz-next.show { display: block; }
  .quiz-next:hover { background: var(--primary-dark); }

  .quiz-result { text-align: center; padding: 26px 10px; }
  .quiz-score { font-size: 46px; font-weight: 800; color: var(--primary); line-height: 1; }
  .quiz-score-sub { font-size: 13px; color: var(--text-2); margin: 10px 0 18px; }
  .quiz-restart {
    border: none; border-radius: var(--radius-sm); background: var(--accent-soft);
    color: #b06a49; font-size: 14px; font-weight: 700; padding: 12px 22px; cursor: pointer;
  }
  .quiz-restart:hover { background: #f0d9c9; }

  .open-q-box { margin-top: 6px; }
  .open-q-text { font-size: 15px; font-weight: 700; line-height: 1.55; margin-bottom: 12px; }
  .open-q-box textarea {
    width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 12px; font-size: 14px; line-height: 1.6; font-family: inherit; resize: vertical;
    color: var(--text-1); background: #fff; box-sizing: border-box;
  }
  .open-q-box textarea:focus { outline: none; border-color: var(--primary); }
  .open-submit {
    margin-top: 10px; border: none; border-radius: var(--radius-sm); background: var(--primary);
    color: #fff; font-size: 14px; font-weight: 700; padding: 12px 22px; cursor: pointer; width: 100%;
  }
  .open-submit:disabled { opacity: .6; cursor: not-allowed; }
  .open-result { margin-top: 14px; background: #faf8f4; border-radius: var(--radius-md); padding: 16px; }
  .open-score { font-size: 40px; font-weight: 800; color: var(--primary); line-height: 1; }
  .open-score span { font-size: 16px; color: var(--text-3); font-weight: 600; }
  .open-comment { font-size: 14px; font-weight: 700; color: var(--text-1); margin: 10px 0 6px; }
  .open-feedback { font-size: 13.5px; color: var(--text-2); line-height: 1.6; }
  .open-error { font-size: 13px; color: #c0392b; }
  .open-done { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
  .open-ref { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .open-ref-title { font-size: 12px; font-weight: 700; color: var(--text-3); margin-bottom: 6px; }
  .open-ref-body { font-size: 13.5px; color: var(--text-1); line-height: 1.7; background: #fff; border-radius: var(--radius-sm); padding: 12px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* 访问口令 */
  .auth-overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-box { width: 100%; max-width: 340px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 24px; }
  .auth-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .auth-hint { font-size: 12px; color: var(--text-3); margin-bottom: 16px; }
  .auth-box input { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; font-size: 15px; margin-bottom: 12px; box-sizing: border-box; }
  .auth-box input:focus { outline: none; border-color: var(--primary); }
  .auth-submit { width: 100%; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer; }
  .auth-msg { font-size: 13px; color: var(--red); margin-top: 10px; text-align: center; }

  /* 计划 */
  .plan-btn { width: 100%; border: 1.5px dashed var(--accent); border-radius: var(--radius); background: var(--accent-soft); color: #b06a49; font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .plan-section { margin-bottom: 16px; }
  .plan-section-title { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 8px; }
  .plan-item { background: var(--card); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .plan-item-info { flex: 1; min-width: 0; }
  .plan-item-title { font-size: 14px; font-weight: 700; }
  .plan-item-progress { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .plan-progress-bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .plan-progress-fill { height: 100%; background: var(--primary); border-radius: 2px; }
  .plan-status { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .plan-status-active { background: var(--green-soft); color: var(--primary-dark); }
  .plan-status-paused { background: var(--amber-soft); color: var(--amber); }
  .plan-status-done { background: var(--blue-soft); color: var(--blue); }
  .plan-badge { background: #eef3f0; color: var(--primary-dark); }
  .edit-btn { border: none; background: transparent; color: var(--blue); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 8px; }
  .outline-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; }
  .outline-item input { flex: 1; border: none; border-bottom: 1px solid transparent; font-size: 14px; padding: 4px; font-family: inherit; }
  .outline-item input:focus { outline: none; border-bottom-color: var(--primary); }
  .outline-del { border: none; background: var(--red-soft); color: var(--red); width: 26px; height: 26px; border-radius: 8px; cursor: pointer; flex: 0 0 26px; }

  /* 主题方向确认 */
  .disambig-box { margin-top: 12px; background: #fdf6ec; border: 1px solid #f0e0c6; border-radius: var(--radius-sm); padding: 12px 14px; }
  .disambig-opt { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-family: inherit; }
  .disambig-opt b { display: block; font-size: 14px; color: var(--text); margin-bottom: 2px; }
  .disambig-opt span { font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
  .disambig-opt:hover { border-color: var(--primary); }

  /* 复习 */
  .review-btn { border: none; border-radius: 999px; background: var(--red); color: #fff; font-size: 12px; font-weight: 700; padding: 6px 12px; cursor: pointer; }
  .review-overlay { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: flex; flex-direction: column; }
  .review-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .review-title { font-size: 16px; font-weight: 700; }
  .review-close { border: none; background: var(--card); color: var(--text); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; box-shadow: var(--shadow); }
  .review-progress { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .review-body { flex: 1; overflow-y: auto; padding: 20px 18px 30px; }
  .review-card-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .review-card-body { font-size: 14px; color: var(--text-2); line-height: 1.7; margin-bottom: 18px; }
  .review-question { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
  .review-skip { border: 1px solid var(--line); background: transparent; color: var(--text-3); font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .review-quiz-wrap { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .review-quiz-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
  .review-q-progress { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
  .review-opt { width: 100%; text-align: left; margin-bottom: 8px; }
  .review-explain { margin-top: 10px; font-size: 13px; color: var(--text-2); background: #faf7f2; border-radius: 8px; padding: 10px 12px; }
  .review-next { display: block; width: 100%; margin-top: 12px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; padding: 12px; border-radius: 10px; cursor: pointer; }
  .review-quiz-result { text-align: center; padding: 18px 0; }
  .review-quiz-score { font-size: 30px; font-weight: 800; color: var(--primary); }
  .review-quiz-sub { font-size: 13px; color: var(--text-2); margin-top: 6px; }
  .review-done { text-align: center; padding: 70px 20px; }
  .review-done-num { font-size: 44px; font-weight: 800; color: var(--primary); }
  .review-done-sub { font-size: 14px; color: var(--text-2); margin: 12px 0 24px; }

  /* 任务卡（首页） */
  .task-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; border: 1px solid transparent; transition: border-color .2s, transform .1s; }
  .task-card:active { border-color: var(--primary); transform: scale(.99); }
  .task-card.paused { opacity: .62; }
  .task-card-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--green-soft); display: flex; align-items: center; justify-content: center; font-size: 21px; flex: 0 0 42px; }
  .task-card-body { flex: 1; min-width: 0; }
  .task-card-title { font-size: 15px; font-weight: 700; }
  .task-card-progress { font-size: 12px; color: var(--text-3); margin-top: 3px; }
  .task-card-actions { display: flex; flex-direction: column; gap: 1px; flex: 0 0 auto; }
  .task-card-actions .edit-btn { font-size: 11px; padding: 3px 6px; }

  /* 任务翻卡视图 */
  .task-overlay { position: fixed; inset: 0; z-index: 85; background: var(--bg); display: flex; flex-direction: column; }
  .task-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .task-head-info { flex: 1; }
  .task-title { font-size: 16px; font-weight: 700; }
  .task-progress { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .task-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .task-flash { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 18px; }
  .task-nav { padding: 14px 18px 22px; display: flex; gap: 10px; border-top: 1px solid var(--line); }
  .task-nav-btn { flex: 1; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer; }
  .task-nav-btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text-2); }
  .task-nav-btn:disabled { opacity: .4; cursor: default; }

  /* 搜索 / 收藏 / 统计 */
  .search-box { margin-bottom: 12px; }
  .search-box input { width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font-size: 14px; background: var(--card); box-sizing: border-box; }
  .search-box input:focus { outline: none; border-color: var(--primary); }
  .entry-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .entry-btn { flex: 1; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); color: var(--text-2); font-size: 13px; font-weight: 600; padding: 10px; cursor: pointer; }
  .fav-btn { margin-left: auto; border: none; background: transparent; color: var(--text-3); font-size: 13px; font-weight: 600; cursor: pointer; }
  .fav-btn.active { color: #b06a49; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-cell { background: var(--card); border-radius: var(--radius-sm); padding: 16px; text-align: center; }
  .stat-cell-num { font-size: 24px; font-weight: 800; color: var(--primary); }
  .stat-cell-label { font-size: 12px; color: var(--text-3); margin-top: 4px; }

  /* 模板选择 + 冷启动引导 */
  .template-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tpl-btn { border: 1px solid var(--line); background: var(--card); color: var(--text-2); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .tpl-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .onboard-overlay { position: fixed; inset: 0; z-index: 110; background: rgba(43,43,40,.5); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .onboard-box { width: 100%; max-width: 360px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 28px 24px; }
  .onboard-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .onboard-sub { font-size: 13px; color: var(--text-2); line-height: 1.7; margin-bottom: 20px; }

  .footer { text-align: center; color: var(--text-3); font-size: 11px; padding: 10px 0 30px; }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-name">
        <div class="logo">微</div>
        <div>
          <div class="brand-title">微知</div>

    </div>

  <main class="content">

      <div id="cardList"></div>
    </section>

    <!-- 详情页 -->
    <section class="view" id="detailView"></section>
  </main>

  <!-- 新建知识弹层 -->
  <div class="create-overlay" id="createOverlay" style="display:none">
    <div class="create-box">
      <div class="create-box-title">新建知识</div>
      <div class="create-hint">选类型，输入主题或链接</div>
      <div class="template-row" id="templateRow">
        <button class="tpl-btn active" data-tpl="t2_reading">精读</button>

    </div>

  <!-- 冷启动引导 -->
  <div class="onboard-overlay" id="onboardOverlay" style="display:none">
    <div class="onboard-box">
      <div class="onboard-title">欢迎使用微知</div>
      <div class="onboard-sub">每天碎片时间学一点：AI 抓取生成卡片、系统学习计划、间隔复习巩固记忆。<br><br>想系统学一个主题，可以「建计划」；想随便看看，直接进入。</div>
      <button class="create-submit" id="onboardPlan" style="background:var(--accent)">建个学习计划</button>
      <button class="create-submit" id="onboardStart">随便看看</button>
    </div>

  <!-- 建计划弹层 -->
  <div class="create-overlay" id="planOverlay" style="display:none">
    <div class="create-box">
      <div class="create-box-title">系统学习计划</div>
      <div class="create-hint">选类型 + 输入主题，AI 帮你拆成学习大纲</div>
      <div class="template-row" id="planTemplateRow">
        <button class="tpl-btn active" data-tpl="t4_trivia">通识</button>
        <button class="tpl-btn" data-tpl="t1_vocab">词汇</button>
        <button class="tpl-btn" data-tpl="t2_reading">精读</button>
        <button class="tpl-btn" data-tpl="t3_math">数学</button>
        <button class="tpl-btn" data-tpl="t5_skill">技能</button>
        <button class="tpl-btn" data-tpl="t6_code">代码</button>
      </div>
      <div class="create-hint" style="margin-top:8px">规模（本次学多少）</div>
      <div class="template-row" id="planScaleRow">
        <button class="tpl-btn" data-scale="20">轻量 · 20 卡</button>

        <button class="tpl-btn" data-scale="100">深度 · 100 卡</button>

      </div>
      <div id="outlineList" style="margin-top:12px"></div>

  <!-- 编辑卡片弹层 -->

      <div class="create-box-title">编辑卡片</div>
      <div class="create-hint">修改标题与正文，保存后即时生效</div>
      <textarea id="editTitleInput" style="min-height:44px;font-weight:700;margin-bottom:8px" placeholder="标题"></textarea>
      <textarea id="editBodyInput" style="min-height:160px" placeholder="正文"></textarea>
      <button class="create-submit" id="editSubmit">保存</button>
      <div class="create-msg" id="editMsg"></div>

  <!-- 复习遮罩 -->
