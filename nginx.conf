# 微知阅读器 · Nginx 反向代理配置（可选）
#
# 作用：把 80 端口转发到 127.0.0.1:8000，这样可省略端口号直接访问 http://服务器IP
# 注意：
#   - 这是可选项。只用 IP+端口（http://服务器IP:8000）访问时，无需此配置。
#   - 国内服务器绑域名需 ICP 备案；自用建议直接用 IP 访问，server_name 填 IP 即可。
#
# 安装：
#   sudo cp nginx.conf /etc/nginx/sites-available/weizhi
#   sudo nano /etc/nginx/sites-available/weizhi   # 按需修改 server_name
#   sudo ln -sf /etc/nginx/sites-available/weizhi /etc/nginx/sites-enabled/weizhi
#   sudo nginx -t && sudo systemctl reload nginx

server {
    # 监听 80 端口（HTTP）
    listen 80;
    listen [::]:80;

    # 改成你的服务器 IP 或域名（自用建议填 IP，免备案）
    server_name 你的服务器IP或域名;

    # 访问日志与错误日志（路径可按需调整）
    access_log /var/log/nginx/weizhi.access.log;
    error_log  /var/log/nginx/weizhi.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # 传递真实客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（DeepSeek 评分/生成接口可能较慢）
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
