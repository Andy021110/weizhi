<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Loop 与 Harness 的职责边界</title><desc id="desc">把“下一步做什么”和“这一步如何安全运行”分开</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#a85f3d"/></marker></defs>
<rect width="1200" height="675" rx="28" fill="#fbf8f1"/>
<text x="64" y="72" font-size="34" font-weight="750" fill="#28251f" text-anchor="start">Loop 与 Harness 的职责边界</text>
<text x="64" y="108" font-size="19" font-weight="400" fill="#746f66" text-anchor="start">把“下一步做什么”和“这一步如何安全运行”分开</text>
<rect x="90" y="155" width="1020" height="430" rx="34" fill="#fffdf8" stroke="#a85f3d" stroke-width="4"/><text x="125" y="207" font-size="23" font-weight="750" fill="#a85f3d" text-anchor="start">HARNESS 运行边界</text><rect x="350" y="270" width="500" height="190" rx="95" fill="#f3dfd2" stroke="#a85f3d" stroke-width="2"/><text x="600" y="345" font-size="38" font-weight="750" fill="#28251f" text-anchor="middle">Agent Loop</text><text x="600" y="388" font-size="21" font-weight="400" fill="#746f66" text-anchor="middle">选择下一步动作</text><rect x="130" y="245" width="210" height="96" rx="22" fill="#dfece3" stroke="#b9d2c1" stroke-width="2"/><text x="235.0" y="293" font-size="23" font-weight="700" fill="#28251f" text-anchor="middle">Context</text><text x="235.0" y="327" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">看到什么</text><rect x="865" y="245" width="210" height="96" rx="22" fill="#dfece3" stroke="#b9d2c1" stroke-width="2"/><text x="970.0" y="293" font-size="23" font-weight="700" fill="#28251f" text-anchor="middle">Permissions</text><text x="970.0" y="327" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">允许什么</text><rect x="130" y="455" width="210" height="96" rx="22" fill="#dfece3" stroke="#b9d2c1" stroke-width="2"/><text x="235.0" y="503" font-size="23" font-weight="700" fill="#28251f" text-anchor="middle">Persistence</text><text x="235.0" y="537" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">怎样恢复</text><rect x="865" y="455" width="210" height="96" rx="22" fill="#dfece3" stroke="#b9d2c1" stroke-width="2"/><text x="970.0" y="503" font-size="23" font-weight="700" fill="#28251f" text-anchor="middle">Events</text><text x="970.0" y="537" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">怎样观察</text><text x="600" y="630" font-size="25" font-weight="700" fill="#49745b" text-anchor="middle">Loop 决定动作；Harness 决定动作发生的条件</text>
</svg>