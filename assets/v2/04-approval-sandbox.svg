<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">安全执行需要两道门</title><desc id="desc">Approval 与 Sandbox 解决不同问题，不能互相替代</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#a85f3d"/></marker></defs>
<rect width="1200" height="675" rx="28" fill="#fbf8f1"/>
<text x="64" y="72" font-size="34" font-weight="750" fill="#28251f" text-anchor="start">安全执行需要两道门</text>
<text x="64" y="108" font-size="19" font-weight="400" fill="#746f66" text-anchor="start">Approval 与 Sandbox 解决不同问题，不能互相替代</text>
<rect x="70" y="260" width="235" height="130" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="187.5" y="308" font-size="28" font-weight="700" fill="#28251f" text-anchor="middle">候选动作</text><text x="187.5" y="342" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">例如：写文件、联网</text><path d="M305 325 L385 325" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="385" y="230" width="260" height="190" rx="22" fill="#f3dfd2" stroke="#a85f3d" stroke-width="2"/><text x="515.0" y="278" font-size="28" font-weight="700" fill="#28251f" text-anchor="middle">Approval</text><text x="515.0" y="312" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">用户是否允许这次动作</text><path d="M645 325 L725 325" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="725" y="230" width="260" height="190" rx="22" fill="#dfece3" stroke="#49745b" stroke-width="2"/><text x="855.0" y="278" font-size="28" font-weight="700" fill="#28251f" text-anchor="middle">Sandbox</text><text x="855.0" y="312" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">实际可以访问哪些资源</text><path d="M985 325 L1125 325" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="1080" y="285" font-size="22" font-weight="700" fill="#28251f" text-anchor="middle">受限执行</text><text x="1080" y="320" font-size="17" font-weight="400" fill="#746f66" text-anchor="middle">文件 / 网络</text><text x="1080" y="348" font-size="17" font-weight="400" fill="#746f66" text-anchor="middle">系统能力</text><text x="515" y="500" font-size="20" font-weight="700" fill="#a85f3d" text-anchor="middle">表达用户意图</text><text x="855" y="500" font-size="20" font-weight="700" fill="#49745b" text-anchor="middle">限制技术边界</text><text x="600" y="580" font-size="28" font-weight="750" fill="#28251f" text-anchor="middle">批准通过后，沙箱仍然继续生效</text>
</svg>