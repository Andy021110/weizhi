<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">用四个问题决定 Harness 规模</title><desc id="desc">能力应由现实约束触发，而不是一次性全部安装</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#a85f3d"/></marker></defs>
<rect width="1200" height="675" rx="28" fill="#fbf8f1"/>
<text x="64" y="72" font-size="34" font-weight="750" fill="#28251f" text-anchor="start">用四个问题决定 Harness 规模</text>
<text x="64" y="108" font-size="19" font-weight="400" fill="#746f66" text-anchor="start">能力应由现实约束触发，而不是一次性全部安装</text>
<rect x="80" y="155" width="430" height="82" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="295.0" y="203" font-size="23" font-weight="700" fill="#28251f" text-anchor="middle">任务跨多天？</text><path d="M510 196 L650 196" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="650" y="155" width="460" height="82" rx="22" fill="#dfece3" stroke="#b9d2c1" stroke-width="2"/><text x="880.0" y="203" font-size="22" font-weight="700" fill="#28251f" text-anchor="middle">事件 + 恢复</text><text x="880.0" y="237" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">回答“是”时增加</text><rect x="80" y="267" width="430" height="82" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="295.0" y="315" font-size="23" font-weight="700" fill="#28251f" text-anchor="middle">动作有高风险副作用？</text><path d="M510 308 L650 308" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="650" y="267" width="460" height="82" rx="22" fill="#dfece3" stroke="#b9d2c1" stroke-width="2"/><text x="880.0" y="315" font-size="22" font-weight="700" fill="#28251f" text-anchor="middle">Approval + Sandbox</text><text x="880.0" y="349" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">回答“是”时增加</text><rect x="80" y="379" width="430" height="82" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="295.0" y="427" font-size="23" font-weight="700" fill="#28251f" text-anchor="middle">需要多端共享状态？</text><path d="M510 420 L650 420" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="650" y="379" width="460" height="82" rx="22" fill="#dfece3" stroke="#b9d2c1" stroke-width="2"/><text x="880.0" y="427" font-size="22" font-weight="700" fill="#28251f" text-anchor="middle">稳定任务身份 + 投影</text><text x="880.0" y="461" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">回答“是”时增加</text><rect x="80" y="491" width="430" height="82" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="295.0" y="539" font-size="23" font-weight="700" fill="#28251f" text-anchor="middle">经验值得跨会话复用？</text><path d="M510 532 L650 532" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="650" y="491" width="460" height="82" rx="22" fill="#dfece3" stroke="#b9d2c1" stroke-width="2"/><text x="880.0" y="539" font-size="22" font-weight="700" fill="#28251f" text-anchor="middle">Memory + Skills 治理</text><text x="880.0" y="573" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">回答“是”时增加</text><text x="600" y="635" font-size="23" font-weight="700" fill="#a85f3d" text-anchor="middle">回答“否”时保持系统更小，避免为未来假设支付复杂度</text>
</svg>