<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">四种 Harness 路线的取舍地图</title><desc id="desc">根据任务特征选能力，而不是先选框架名称</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#a85f3d"/></marker></defs>
<rect width="1200" height="675" rx="28" fill="#fbf8f1"/>
<text x="64" y="72" font-size="34" font-weight="750" fill="#28251f" text-anchor="start">四种 Harness 路线的取舍地图</text>
<text x="64" y="108" font-size="19" font-weight="400" fill="#746f66" text-anchor="start">根据任务特征选能力，而不是先选框架名称</text>
<path d="M145 545 L1080 545" stroke="#746f66" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M145 545 L145 155" stroke="#746f66" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="1090" y="580" font-size="20" font-weight="600" fill="#746f66" text-anchor="end">任务长度与恢复需求 →</text><text x="55" y="175" font-size="20" font-weight="600" fill="#746f66" text-anchor="start">风险与控制需求 ↑</text><rect x="310" y="455" width="220" height="100" rx="22" fill="#f3dfd2" stroke="#d9d0c2" stroke-width="2"/><text x="420.0" y="503" font-size="25" font-weight="700" fill="#28251f" text-anchor="middle">Pi</text><text x="420.0" y="537" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">小工作集</text><rect x="675" y="395" width="220" height="100" rx="22" fill="#e7e5f2" stroke="#d9d0c2" stroke-width="2"/><text x="785.0" y="443" font-size="25" font-weight="700" fill="#28251f" text-anchor="middle">OpenCode</text><text x="785.0" y="477" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">事件与恢复</text><rect x="885" y="225" width="220" height="100" rx="22" fill="#dfece3" stroke="#d9d0c2" stroke-width="2"/><text x="995.0" y="273" font-size="25" font-weight="700" fill="#28251f" text-anchor="middle">Codex</text><text x="995.0" y="307" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">安全与生命周期</text><rect x="430" y="225" width="220" height="100" rx="22" fill="#efe4d4" stroke="#d9d0c2" stroke-width="2"/><text x="540.0" y="273" font-size="25" font-weight="700" fill="#28251f" text-anchor="middle">Hermes</text><text x="540.0" y="307" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">长期记忆复用</text><text x="600" y="630" font-size="22" font-weight="700" fill="#a85f3d" text-anchor="middle">位置表示关注重点，不表示统一排名</text>
</svg>