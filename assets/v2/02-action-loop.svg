<text x="64" y="108" font-size="19" font-weight="400" fill="#746f66" text-anchor="start">模型不直接改变环境；外部程序执行并把观察送回上下文</text>
<rect x="470" y="250" width="260" height="130" rx="22" fill="#f3dfd2" stroke="#d9d0c2" stroke-width="2"/><text x="600.0" y="298" font-size="28" font-weight="700" fill="#28251f" text-anchor="middle">当前上下文</text><text x="600.0" y="332" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">模型每轮真正看到的内容</text><rect x="470" y="145" width="260" height="105" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="600.0" y="193" font-size="28" font-weight="700" fill="#28251f" text-anchor="middle">模型</text><text x="600.0" y="227" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">生成下一步</text><rect x="825" y="285" width="260" height="105" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="955.0" y="333" font-size="28" font-weight="700" fill="#28251f" text-anchor="middle">动作</text><text x="955.0" y="367" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">调用工具</text><rect x="470" y="455" width="260" height="105" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="600.0" y="503" font-size="28" font-weight="700" fill="#28251f" text-anchor="middle">环境</text><text x="600.0" y="537" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">产生真实变化</text><rect x="115" y="285" width="260" height="105" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="245.0" y="333" font-size="28" font-weight="700" fill="#28251f" text-anchor="middle">观察</text><text x="245.0" y="367" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">返回执行结果</text><path d="M730 196 L825 300" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M955 390 L730 498" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M470 505 L375 390" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M245 285 L470 196" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="600" y="624" font-size="23" font-weight="700" fill="#49745b" text-anchor="middle">闭环成立后，系统才会根据真实结果继续决策</text>
