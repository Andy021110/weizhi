<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Agent 能力如何逐层出现</title><desc id="desc">从一次模型调用出发，而不是从组件清单出发</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#a85f3d"/></marker></defs>
<rect width="1200" height="675" rx="28" fill="#fbf8f1"/>
<text x="64" y="72" font-size="34" font-weight="750" fill="#28251f" text-anchor="start">Agent 能力如何逐层出现</text>
<text x="64" y="108" font-size="19" font-weight="400" fill="#746f66" text-anchor="start">从一次模型调用出发，而不是从组件清单出发</text>
<rect x="55" y="250" width="190" height="126" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="150.0" y="298" font-size="26" font-weight="700" fill="#28251f" text-anchor="middle">LLM</text><text x="150.0" y="332" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">一次输入 → 输出</text><path d="M245 313 L273 313" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="280" y="250" width="190" height="126" rx="22" fill="#f3dfd2" stroke="#d9d0c2" stroke-width="2"/><text x="375.0" y="298" font-size="26" font-weight="700" fill="#28251f" text-anchor="middle">Context</text><text x="375.0" y="332" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">补齐本轮所需信息</text><path d="M470 313 L498 313" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="505" y="250" width="190" height="126" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="600.0" y="298" font-size="26" font-weight="700" fill="#28251f" text-anchor="middle">Tools</text><text x="600.0" y="332" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">接触外部世界</text><path d="M695 313 L723 313" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="730" y="250" width="190" height="126" rx="22" fill="#f3dfd2" stroke="#d9d0c2" stroke-width="2"/><text x="825.0" y="298" font-size="26" font-weight="700" fill="#28251f" text-anchor="middle">Loop</text><text x="825.0" y="332" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">依据结果继续行动</text><path d="M920 313 L948 313" stroke="#a85f3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="955" y="250" width="190" height="126" rx="22" fill="#fffdf8" stroke="#d9d0c2" stroke-width="2"/><text x="1050.0" y="298" font-size="26" font-weight="700" fill="#28251f" text-anchor="middle">Memory</text><text x="1050.0" y="332" font-size="18" font-weight="400" fill="#746f66" text-anchor="middle">跨会话检索经验</text><text x="600" y="465" font-size="27" font-weight="700" fill="#a85f3d" text-anchor="middle">每一层都在回答前一层暴露出的边界</text><text x="600" y="510" font-size="20" font-weight="400" fill="#746f66" text-anchor="middle">先找缺失能力，再决定是否增加组件</text>
</svg>