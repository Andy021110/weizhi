<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 560px; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #FBFAF8;
    display: flex; align-items: center;
  }
  .wrap { display: flex; align-items: center; width: 100%; padding: 0 56px; gap: 40px; }
  .left { flex: 1; }
  .eyebrow {
    display: inline-block; font-size: 12.5px; color: #2F6D47;
    background: #E7F2EC; border-radius: 999px; padding: 5px 13px;
    letter-spacing: .3px; margin-bottom: 18px;
  }
  h1 { font-size: 46px; color: #2B2B28; letter-spacing: -1px; line-height: 1.1; }
  h1 span { font-size: 20px; color: #9A9890; font-weight: 400; letter-spacing: 0; margin-left: 10px; }
  .sub {
    font-size: 15.5px; color: #55534D; line-height: 1.85; margin-top: 16px;
    max-width: 540px;
  }
  .sub b { color: #2B2B28; font-weight: 600; }
  .nums { display: flex; gap: 30px; margin-top: 26px; }
  .num b { font-size: 26px; color: #2F6D47; font-weight: 700; letter-spacing: -.5px; }
  .num i {
    display: block; font-style: normal; font-size: 11.5px; color: #8A877E;
    margin-top: 3px; letter-spacing: .2px;
  }
  .foot {
    margin-top: 26px; padding-top: 16px; border-top: 1px solid #E8E4DC;
    font-size: 12px; color: #8A877E; line-height: 1.7;
    display: flex; align-items: baseline; gap: 8px;
  }
  .foot code {
    font-family: "SF Mono", Menlo, monospace; font-size: 11.5px;
    background: #F1EFE9; color: #4A4842; padding: 3px 7px; border-radius: 5px;
  }
  .phone {
    width: 296px; height: 560px; border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 48px rgba(60,55,45,.18), 0 0 0 1px #E4E0D8;
    background: #fff; flex: none; position: relative;
  }
  .phone img { width: 296px; display: block; }
  .phone::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 82%, rgba(60,55,45,.10) 100%);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="eyebrow">单用户自托管 · 在线只读演示已开放</div>
      <h1>微知 WeiZhi<span>个人 AI 学习管家</span></h1>
      <div class="sub">
        每天自动挑出<b>值得读的几篇</b>，生成<b>每条事实都能回溯到原文</b>的学习卡片，
        再按间隔重复推回你面前。质量自己巡检、自己修，需要你拍板的事才来找你。
      </div>
      <div class="nums">
        <div class="num"><b>24</b><i>天连续运行</i></div>
        <div class="num"><b>516</b><i>张卡片</i></div>
        <div class="num"><b>1659</b><i>条可回溯证据</i></div>
        <div class="num"><b>578</b><i>个测试</i></div>
      </div>
      <div class="foot">
        <span>一台 2C2G 服务器 · 模型成本每天两毛钱上下 · 演示：</span>
        <code>47.76.25.13/?key=WeiZhi-Demo-ReadOnly-4t8m</code>
      </div>
    </div>
    <div class="phone"><img src="01-home.png" alt="微知首页"></div>
  </div>
</body>
</html>
