<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ea">
  <title>微知 · 学习包</title>
  <style>
    :root{--bg:#f6f2ea;--surface:#fffdf8;--text:#28251f;--muted:#746f66;--line:#ded7ca;--accent:#a85f3d;--accent-soft:#f3dfd2;--ok:#49745b;--danger:#9a433c;--shadow:0 12px 35px rgba(63,50,36,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1040px;margin:auto;padding:24px 20px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--text);color:var(--surface)}.budget{color:var(--muted);font-size:14px}.nav{display:flex;gap:4px;margin:20px 0 28px;padding:4px;background:rgba(255,255,255,.48);border-radius:14px}.nav button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;color:var(--muted)}.nav button.active{background:var(--surface);color:var(--text);box-shadow:0 2px 10px rgba(50,40,25,.06)}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);gap:18px}.stack{display:grid;gap:16px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.panel h1,.panel h2,.panel h3{line-height:1.3;margin:0 0 10px}.panel p{margin:0 0 12px}.muted{color:var(--muted)}.chips,.actions{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:#70422e;font-size:12px}.btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 14px;border-radius:12px;min-height:44px}.btn.primary{border-color:var(--text);background:var(--text);color:var(--surface)}.btn.ghost{border-color:transparent}.actions{margin-top:16px}.progress{height:7px;background:#e8e1d6;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:var(--accent)}.section-title{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 14px}.section-title h2{margin:0}.empty{padding:34px 18px;text-align:center;color:var(--muted)}.path{display:grid}.step{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}.step-num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#eee8dd;color:var(--muted)}.step.current .step-num{background:var(--text);color:var(--surface)}.step-title{font-weight:650}.time{white-space:nowrap;color:var(--muted);font-size:14px}.form{display:grid;gap:14px}.field label{display:block;margin-bottom:5px;font-size:14px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;color:var(--text)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px 14px;border-radius:12px;background:#f1eadf;color:var(--muted);margin-bottom:14px}.pack-head{margin-bottom:18px}.card-reading{max-width:720px}.objective{border-left:3px solid var(--accent);padding-left:14px;margin:16px 0 20px}.body-text{font-size:17px;line-height:1.85;white-space:pre-wrap}.evidence{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.evidence summary{cursor:pointer;color:var(--muted)}.quiz{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.option{display:block;width:100%;text-align:left;margin:8px 0}.feedback{min-height:24px;margin-top:8px;color:var(--ok)}.source-row,.goal-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.source-row:last-child,.goal-row:last-child{border-bottom:0}.goal-card{border-bottom:1px solid var(--line);padding:14px 0}.goal-card:last-child{border-bottom:0}.goal-card summary{cursor:pointer;list-style:none}.goal-card summary::-webkit-details-marker{display:none}.goal-summary-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}.goal-card h3{font-size:17px;margin:0 0 6px}.goal-expand{font-size:12px;color:var(--accent)}.goal-detail{padding:14px 0 4px}.goal-block{margin:12px 0}.goal-block h4{margin:0 0 7px;font-size:13px;color:var(--muted);letter-spacing:.06em}.goal-block ol,.goal-block ul{margin:0;padding-left:21px}.goal-block li{margin:7px 0}.milestone-active{font-weight:650;color:var(--accent)}.status{font-size:12px;padding:3px 8px;border-radius:99px;background:#ece6dc;color:var(--muted);white-space:nowrap}.status.ready,.status.published,.status.completed,.status.active{background:#dfece3;color:#315d41}.status.draft{background:#f3dfd2;color:#70422e}.back{margin-bottom:12px}.error{color:var(--danger);margin-top:8px}.success{color:var(--ok);margin-top:8px}
    .reader-grid{align-items:start}.card-reading{max-width:none}.reading-guide{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 22px;padding:11px 13px;border-radius:12px;background:#f1eadf;color:var(--muted);font-size:13px}.reading-jumps{display:flex;gap:5px;flex-wrap:wrap}.reading-jumps button{border:0;background:var(--surface);padding:5px 9px;border-radius:99px;color:var(--muted)}.lead{font-size:19px!important;line-height:1.75!important;color:#4c473f;margin:0 0 28px!important}.article-section{padding:6px 0 18px}.article-section h2{font-size:21px;margin:0 0 10px}.article-section p{font-size:17px;line-height:1.9;margin:0 0 13px}.learning-figure{margin:8px 0 28px}.learning-figure img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:16px;background:var(--bg)}.learning-figure figcaption{font-size:13px;color:var(--muted);margin-top:8px}.figure-takeaway{margin-top:8px;padding:10px 12px;border-left:3px solid var(--accent);background:#f7f0e9;font-size:14px}.key-box{background:#f3eee5;border-radius:15px;padding:18px;margin:10px 0 22px}.key-box h2{font-size:18px}.key-box ul{margin:8px 0 0;padding-left:22px}.key-box li{margin:7px 0}.comparison-wrap{overflow-x:auto;margin:6px 0 24px}.comparison{width:100%;border-collapse:collapse;font-size:14px}.comparison th,.comparison td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.comparison th{color:var(--muted);font-weight:600}.source-links{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.source-link{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;font-size:14px;padding:7px 10px;border:1px solid #dfc5b7;border-radius:10px;background:#fff8f3}.source-link:hover{text-decoration:underline}.evidence-card{padding:14px 0;border-bottom:1px solid var(--line)}.evidence-card:last-child{border-bottom:0}.evidence-claim{font-weight:650;margin-bottom:6px}.evidence-quote{padding-left:12px;border-left:3px solid var(--accent);color:var(--muted)}.evidence-source{font-size:12px;color:var(--muted);margin-top:8px}.evidence-source a{color:var(--accent)}.quiz-panel{position:sticky;top:16px}.card-flow{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.read-progress{height:5px;background:#e9e1d7;border-radius:99px;overflow:hidden;margin-bottom:14px}.read-progress span{display:block;height:100%;background:var(--accent)}
    @media(max-width:720px){.app{padding:16px 14px 80px}.grid,.two{grid-template-columns:1fr}.nav{position:sticky;top:0;z-index:4}.nav button{font-size:14px;padding:9px 5px}.panel{padding:18px;border-radius:17px}.step{grid-template-columns:34px 1fr}.time{grid-column:2}.body-text{font-size:16px}.reading-guide{align-items:flex-start;flex-direction:column}.lead{font-size:17px!important}.article-section p{font-size:16px}.quiz-panel{position:static}.reader-grid{gap:14px}}
    .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand"><span class="logo">知</span><span>微知</span></div><div class="budget" id="budgetLabel">今天 · 90 分钟</div></header>
  <nav class="nav" aria-label="主导航">
    <button class="active" data-page="today">今天</button><button data-page="goals">目标</button><button data-page="library">资料库</button><button data-page="progress">进展</button>
  </nav>

  <section class="page active" id="page-today"><div id="todayContent" class="empty">正在加载今天的学习安排…</div></section>

  <section class="page" id="page-goals">
    <div class="grid"><section class="panel"><div class="eyebrow">建立能力路径</div><h1>你想学会做什么？</h1><p class="muted">不需要选择卡片模板。系统会根据目标和材料规划下一段学习路径。</p>
      <form class="form" id="goalForm">
        <div class="field"><label for="goalOutcome">能力目标</label><textarea id="goalOutcome" rows="2" required placeholder="例如：能读懂并判断主流 Agent Harness 的架构取舍"></textarea></div>
        <div class="field"><label for="goalLevel">当前水平</label><textarea id="goalLevel" rows="2" required placeholder="例如：了解 LLM 和 Tool Calling，但没系统看过运行时"></textarea></div>
        <div class="field"><label for="goalContext">使用场景</label><input id="goalContext" required placeholder="例如：Agent 产品与工程设计"></div>
        <div class="field"><label for="goalMinutes">每日时间</label><select id="goalMinutes"><option value="60">60 分钟</option><option value="90" selected>90 分钟</option><option value="120">120 分钟</option></select></div>
        <button class="btn primary" type="submit">创建学习目标</button><div id="goalMessage" aria-live="polite"></div>
      </form></section>
      <aside class="panel"><div class="eyebrow">7 条长期学习路径</div><p class="muted">每条路径分为 5 个里程碑。当前完整启动包用 3 张卡展示“核心概念 → 引导练习 → 迁移任务”，后续学习包再按掌握结果逐步生成。</p><div id="goalList" class="empty">还没有学习目标</div></aside>
    </div>
  </section>

  <section class="page" id="page-library">
    <div class="grid"><section class="panel"><div class="eyebrow">添加可信材料</div><h2>文章、PDF、论文或代码仓库</h2><form class="form" id="sourceForm">
      <div class="field"><label for="sourceType">材料类型</label><select id="sourceType"><option value="article">网页文章</option><option value="pdf">PDF</option><option value="paper">论文</option><option value="repository">代码仓库</option><option value="note">个人笔记</option></select></div>
      <div class="field"><label for="sourceUrl">地址或标识</label><input id="sourceUrl" required placeholder="https://… 或本地材料标识"></div>
      <div class="field"><label for="sourceTitle">标题</label><input id="sourceTitle" required placeholder="材料标题"></div>
      <button class="btn primary" type="submit">加入处理队列</button><div id="sourceMessage" aria-live="polite"></div>
    </form></section><aside class="panel"><div class="eyebrow">材料库</div><div id="sourceList" class="empty">还没有材料</div></aside></div>
    <section style="margin-top:18px"><div class="section-title"><h2>学习包</h2><span class="muted">候选、进行中与已完成</span></div><div id="packList" class="stack"></div></section>
  </section>

  <section class="page" id="page-progress"><div class="grid"><section class="panel"><div class="eyebrow">学习结果</div><h2>目标级进展</h2><div id="progressContent" class="empty">完成学习包后，这里会显示已学习和待验证目标。</div></section><aside class="panel"><div class="eyebrow">当前原则</div><h3>只计算真正学会的目标</h3><p class="muted">卡片库存、生成数量和连续打卡不作为完成结果。</p></aside></div></section>

  <section class="page" id="page-pack"><button class="btn ghost back" data-page-link="library">← 返回资料库</button><div id="packDetail"></div></section>
  <section class="page" id="page-card"><button class="btn ghost back" id="backToPack">← 返回学习包</button><div id="cardDetail"></div></section>
</main>
<script>
(function(){
  var state={today:null,goals:[],sources:[],packs:[],currentPack:null,currentCard:null,currentCardIndex:0};
  var tokenKey='weizhi_token';
  function token(){try{return new URLSearchParams(location.search).get('key')||localStorage.getItem(tokenKey)||''}catch(e){return''}}
  function headers(){var t=token();return Object.assign({'Content-Type':'application/json'},t?{'X-Auth-Token':t}:{})}
  function esc(x){return String(x==null?'':x).replace(/[&<>'"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
  function safeHref(x){try{var u=new URL(String(x||''),location.origin);return u.protocol==='http:'||u.protocol==='https:'?u.href:'#'}catch(e){return'#'}}
  function learningChars(content){content=content||{};var parts=[content.lead||''];(content.sections||[]).forEach(function(s){parts=parts.concat(s.paragraphs||[])});parts=parts.concat(content.key_points||[]);(content.quiz||[]).forEach(function(q){parts.push(q.explanation||'')});return parts.join('').replace(/\s/g,'').length}
  function get(url){return fetch(url,{headers:headers()}).then(function(r){return r.json()})}
  function post(url,data){return fetch(url,{method:'POST',headers:headers(),body:JSON.stringify(data)}).then(function(r){return r.json()})}
  function packUrl(id){var q=new URLSearchParams();q.set('pack',id);var t=token();if(t)q.set('key',t);return'/v2?'+q.toString()}
  document.addEventListener('click',function(e){var target=e.target.closest&&e.target.closest('[data-open-pack]');if(!target)return;e.preventDefault();e.stopPropagation();location.href=packUrl(target.dataset.openPack)},true);
  function decorateGoalControls(){document.querySelectorAll('#goalList .goal-card').forEach(function(card,index){var goal=state.goals[index],detail=card.querySelector('.goal-detail');if(!goal||!detail||detail.querySelector('.goal-control'))return;var wrap=document.createElement('div');wrap.className='actions goal-control';var button=document.createElement('button');button.className=goal.status==='active'?'btn':'btn primary';button.textContent=goal.status==='active'?'暂停当前主线':'设为当前主线';button.onclick=function(e){e.preventDefault();e.stopPropagation();button.disabled=true;post('/api/v2/goals/status',{goal_id:goal.id,status:goal.status==='active'?'paused':'active'}).then(function(d){if(d.error){button.disabled=false;button.textContent=d.error;return}loadGoals();loadToday()})};wrap.appendChild(button);detail.appendChild(wrap)})}
  new MutationObserver(decorateGoalControls).observe(document.getElementById('goalList'),{childList:true,subtree:true});
  function show(name){document.querySelectorAll('.page').forEach(function(x){x.classList.toggle('active',x.id==='page-'+name)});document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x.dataset.page===name)});window.scrollTo(0,0)}
  document.querySelectorAll('[data-page]').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.page);if(b.dataset.page==='today')loadToday();if(b.dataset.page==='library')loadLibrary();if(b.dataset.page==='goals')loadGoals()})});
  document.querySelectorAll('[data-page-link]').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.pageLink)})});

  function loadToday(){get('/api/v2/today').then(function(d){state.today=d;document.getElementById('budgetLabel').textContent='今天 · '+d.minute_budget+' 分钟';renderToday()}).catch(function(){document.getElementById('todayContent').innerHTML='<div class="panel error">无法加载今日安排</div>'})}
  function renderToday(){var d=state.today||{};var packs=d.packs||[],reviews=d.reviews||[];var html='<div class="grid"><div class="stack">';if(packs.length){var p=packs[0],done=(p.cards||[]).filter(function(c){return c.learning_state&&c.learning_state.first_learned_at}).length;var pct=Math.round(done/(p.cards.length||1)*100);html+='<article class="panel"><div class="eyebrow">继续学习 · '+esc(p.estimated_minutes)+' 分钟</div><h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.pack_objective)+'</p><div class="progress"><span style="width:'+pct+'%"></span></div><div class="chips"><span class="chip">'+p.cards.length+' 张卡</span><span class="chip">证据与目标门禁</span></div><div class="actions"><button class="btn primary" data-open-pack="'+esc(p.id)+'">查看学习包</button></div></article>'}else{html+='<article class="panel empty"><h2>今天没有已发布的新学习包</h2><p>先创建学习目标或添加材料；系统不会为了填满数量发布低价值内容。</p><div class="actions"><button class="btn primary" data-go="goals">新建学习目标</button><button class="btn" data-go="library">添加材料</button></div></article>'}html+='</div><aside class="stack"><article class="panel"><div class="eyebrow">到期验证</div><h2>'+reviews.length+' 个目标</h2><p class="muted">预计 '+(reviews.length*3)+' 分钟。复习优先占用每日约四分之一预算。</p></article><article class="panel"><div class="eyebrow">今日预算</div><h2>'+esc(d.estimated_minutes||0)+' / '+esc(d.minute_budget||90)+' 分钟</h2><p class="muted">剩余 '+esc(d.remaining_minutes==null?90:d.remaining_minutes)+' 分钟可用于主动探索。</p></article></aside></div>';document.getElementById('todayContent').className='';document.getElementById('todayContent').innerHTML=html;bindDynamic()}

  function goalPriority(g){var x=g.outcome||'';if(x.indexOf('AI 产品')>=0)return 0;if(x.indexOf('大模型完整基础')>=0)return 1;if(x.indexOf('Transformer')>=0)return 2;if(x.indexOf('LoRA')>=0)return 5;if(x.indexOf('RAG')>=0)return 3;if(x.indexOf('Agent')>=0)return 4;if(x.indexOf('源码')>=0)return 6;return 9}
  function loadGoals(){Promise.all([get('/api/v2/goals'),get('/api/v2/packs')]).then(function(all){state.goals=(all[0].goals||[]).filter(function(g){return g.status!=='archived'});state.packs=(all[1].packs||[]).filter(function(p){return p.status!=='archived'&&p.status!=='rejected'});state.goals.sort(function(a,b){return goalPriority(a)-goalPriority(b)});document.getElementById('goalList').className='';document.getElementById('goalList').innerHTML=state.goals.length?state.goals.map(function(g,i){var milestones=g.milestones||[],evidence=g.success_evidence||[],related=state.packs.filter(function(p){return p.goal_id===g.id}),packAction=related.length?'<div class="actions"><button class="btn primary" data-open-pack="'+esc(related[related.length-1].id)+'">打开启动学习包</button><span class="chip">'+related.length+' 个学习包</span></div>':'<div class="muted">启动学习包尚未生成</div>';return'<details class="goal-card"'+(i===0?' open':'')+'><summary><div class="goal-summary-top"><span class="status '+esc(g.status)+'">任务 '+(i+1)+' / '+state.goals.length+'</span><span class="goal-expand">展开查看 ↓</span></div><h3>'+esc(g.outcome)+'</h3><div class="muted">'+esc(g.use_context)+' · '+esc(g.daily_minutes)+' 分钟/天</div></summary><div class="goal-detail"><div class="goal-block"><h4>当前起点</h4><div>'+esc(g.current_level)+'</div></div><div class="goal-block"><h4>学习路径</h4><ol>'+milestones.map(function(m){return'<li class="'+(m.status==='active'?'milestone-active':'')+'">'+esc(m.outcome)+'</li>'}).join('')+'</ol></div><div class="goal-block"><h4>如何证明真的学会</h4><ul>'+evidence.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'+packAction+'</div></details>'}).join(''):'<div class="empty">还没有学习目标</div>';bindDynamic()})}
  document.getElementById('goalForm').addEventListener('submit',function(e){e.preventDefault();var msg=document.getElementById('goalMessage');msg.className='muted';msg.textContent='正在创建…';post('/api/v2/goals',{outcome:document.getElementById('goalOutcome').value,current_level:document.getElementById('goalLevel').value,use_context:document.getElementById('goalContext').value,daily_minutes:Number(document.getElementById('goalMinutes').value),milestones:['建立基础心智模型','理解真实材料与系统','完成迁移应用']}).then(function(d){msg.className=d.error?'error':'success';msg.textContent=d.error||'目标已创建，下一步可添加相关材料。';if(!d.error){e.target.reset();loadGoals()}})});

  function loadLibrary(){Promise.all([get('/api/v2/sources'),get('/api/v2/packs')]).then(function(all){state.sources=all[0].sources||[];state.packs=(all[1].packs||[]).filter(function(p){return p.status!=='archived'&&p.status!=='rejected'});document.getElementById('sourceList').className='';document.getElementById('sourceList').innerHTML=state.sources.length?state.sources.map(function(s){var href=safeHref(s.canonical_uri),count=Number(s.supported_claim_count||0),canPlan=s.status==='ready'&&count>=2&&s.snapshot_path,canProcess=(s.status==='pending'||s.status==='failed')&&['article','paper','pdf'].indexOf(s.source_type)>=0,detail=s.processing_detail||{},action=canPlan?'<div class="actions"><button class="btn" data-plan-source="'+esc(s.id)+'">用 '+count+' 条核验证据生成学习包</button></div>':(canProcess?'<div class="actions"><button class="btn" data-process-source="'+esc(s.id)+'">'+(s.status==='failed'?'重新抓取并核验':'开始抓取并核验')+'</button></div>':(s.status==='ready'&&count<2&&s.snapshot_path?'<div class="muted">证据不足，暂不单独成卡</div>':'')),failure=s.status==='failed'&&detail.error?'<div class="error">'+esc(detail.error)+'</div>':'';return'<div class="source-row"><div><strong>'+(href==='#'?esc(s.title):'<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+' ↗</a>')+'</strong><div class="muted">'+esc(s.source_type)+' · '+count+' 条核验证据</div>'+failure+action+'</div><span class="status '+esc(s.status)+'">'+esc(s.status)+'</span></div>'}).join(''):'<div class="empty">还没有材料</div>';document.getElementById('packList').innerHTML=state.packs.length?state.packs.map(function(p){return'<article class="panel"><div class="eyebrow">'+esc(p.status)+' · '+esc(p.estimated_minutes)+' 分钟</div><h3>'+esc(p.title)+'</h3><p class="muted">'+esc(p.pack_objective)+'</p><div class="chips"><span class="chip">'+(p.cards||[]).length+' 张卡</span></div><div class="actions"><button class="btn" data-open-pack="'+esc(p.id)+'">打开学习包</button></div></article>'}).join(''):'<div class="panel empty">尚无学习包。来源通过证据与价值门禁后，才会进入这里。</div>';bindDynamic()})}
  document.getElementById('sourceForm').addEventListener('submit',function(e){e.preventDefault();var form=e.target,msg=document.getElementById('sourceMessage'),kind=document.getElementById('sourceType').value;msg.className='muted';msg.textContent='正在保存并抓取材料…';post('/api/v2/sources',{source_type:kind,canonical_uri:document.getElementById('sourceUrl').value,title:document.getElementById('sourceTitle').value,status:'pending'}).then(function(d){if(d.error){msg.className='error';msg.textContent=d.error;return}if(['article','paper','pdf'].indexOf(kind)<0){msg.className='success';msg.textContent='材料已加入资料库。';form.reset();loadLibrary();return}post('/api/v2/sources/process',{source_id:d.source.id}).then(function(result){msg.className=result.error?'error':'success';msg.textContent=result.error||('抓取完成，得到 '+result.supported_claims+' 条核验证据。');form.reset();loadLibrary()})})});

  function openPack(id,cardIndex){get('/api/v2/packs?id='+encodeURIComponent(id)).then(function(d){state.currentPack=d.pack;if(Number.isInteger(cardIndex)){openCard(Math.max(0,Math.min(cardIndex,(d.pack.cards||[]).length-1)))}else{renderPack();show('pack')}})}
  function renderPack(){var p=state.currentPack;if(!p)return;var sources=(p.sources||[]).filter(function(s){return safeHref(s.canonical_uri)!=='#'}).map(function(s){return'<a class="source-link" href="'+esc(safeHref(s.canonical_uri))+'" target="_blank" rel="noopener noreferrer">↗ 查看信源：'+esc(s.title)+'</a>'}).join('');var review=p.status==='candidate'?'<button class="btn" id="publishPack">通过并发布</button><button class="btn" id="rejectPack">拒绝候选</button>':'';document.getElementById('packDetail').innerHTML='<article class="panel pack-head"><div class="eyebrow">学习包 · '+esc(p.estimated_minutes)+' 分钟</div><h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.pack_objective)+'</p>'+(sources?'<div class="source-links">'+sources+'</div>':'')+'<div class="path">'+p.cards.map(function(c,i){var done=c.learning_state&&c.learning_state.first_learned_at,chars=learningChars((c.version||{}).content);return'<div class="step '+(!done?'current':'')+'"><span class="step-num">'+(done?'✓':i+1)+'</span><div><div class="step-title">'+esc(c.learning_objective)+'</div><div class="muted">'+esc(c.minimum_recall)+'</div></div><span class="time">'+esc(c.estimated_minutes)+' 分钟<br>'+esc(chars)+' 字</span></div>'}).join('')+'</div><div class="actions"><button class="btn primary" data-open-card="0">'+(p.status==='candidate'?'预览第 1 张':'开始或继续')+'</button>'+review+'</div></article>';bindDynamic();var publish=document.getElementById('publishPack');if(publish)publish.onclick=function(){publish.disabled=true;post('/api/v2/packs/publish',{pack_id:p.id}).then(function(d){if(d.error){publish.disabled=false;alert(d.error);return}state.currentPack=d.pack;renderPack();loadLibrary();loadToday()})};var reject=document.getElementById('rejectPack');if(reject)reject.onclick=function(){reject.disabled=true;post('/api/v2/packs/reject',{pack_id:p.id}).then(function(d){if(d.error){reject.disabled=false;alert(d.error);return}loadLibrary();show('library')})}}
  function renderFigure(item){return'<figure class="learning-figure"><img src="'+esc(item.src)+'" alt="'+esc(item.alt||'')+'" loading="lazy"><figcaption>'+esc(item.caption||'')+'</figcaption>'+(item.takeaway?'<div class="figure-takeaway"><strong>读图结论：</strong>'+esc(item.takeaway)+'</div>':'')+'</figure>'}
  function renderReading(content){
    var html=content.lead?'<p class="lead">'+esc(content.lead)+'</p>':'';
    var sections=content.sections||[],figures=content.illustrations||[];
    if(sections.length){html+=sections.map(function(section,i){return'<section class="article-section" id="reading-section-'+i+'"><h2>'+esc(section.heading)+'</h2>'+(section.paragraphs||[]).map(function(p){return'<p>'+esc(p)+'</p>'}).join('')+'</section>'+figures.filter(function(x){return Number(x.after_section)===i}).map(renderFigure).join('')}).join('')}
    else{html+='<div class="body-text">'+esc(content.body||'这张卡的正文尚未生成。')+'</div>'}
    if((content.comparison||[]).length){html+='<div class="comparison-wrap"><table class="comparison"><thead><tr><th>路线</th><th>重点</th><th>获得</th><th>代价</th></tr></thead><tbody>'+content.comparison.map(function(x){return'<tr><td><strong>'+esc(x.name)+'</strong></td><td>'+esc(x.focus)+'</td><td>'+esc(x.gain)+'</td><td>'+esc(x.cost)+'</td></tr>'}).join('')+'</tbody></table></div>'}
    if((content.key_points||[]).length){html+='<section class="key-box"><h2>离开这张卡前，记住这些</h2><ul>'+content.key_points.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul></section>'}
    return html
  }
  function renderEvidence(content){var items=content.evidence_quotes||[];if(!items.length){items=(content.factual_sentences||[]).map(function(x){return{claim:x.text,quote:'当前卡只保存了主张映射。',source:''}})}return items.length?items.map(function(x){var label=x.source||'查看原始信源';var source=x.source_url&&safeHref(x.source_url)!=='#'?'<a href="'+esc(safeHref(x.source_url))+'" target="_blank" rel="noopener noreferrer">↗ '+esc(label)+'</a>':esc(label);return'<div class="evidence-card"><div class="evidence-claim">'+esc(x.claim)+'</div><div class="evidence-quote">'+esc(x.quote)+'</div>'+(x.source||x.source_url?'<div class="evidence-source">来源：'+source+'</div>':'')+'</div>'}).join(''):'<p class="muted">个人知识卡或暂无外部事实。</p>'}
  function openCard(index){
    var cards=state.currentPack.cards||[];state.currentCardIndex=index;state.currentCard=cards[index];if(!state.currentCard)return;
    var c=state.currentCard,v=c.version||{},content=v.content||{},quiz=(content.quiz||[])[0];
    var jumps='<div class="reading-jumps"><button data-jump="readingBody">正文</button><button data-jump="evidenceBlock">证据</button><button data-jump="quizBlock">题目</button></div>';
    var previous=index>0?'<button class="btn" data-open-card="'+(index-1)+'">← 上一张</button>':'<span></span>';
    var next=index<cards.length-1?'<button class="btn" data-open-card="'+(index+1)+'">下一张 →</button>':'<button class="btn" id="backToPackBottom">返回学习包</button>';
    var quizHtml=quiz?'<h3>'+esc(quiz.question)+'</h3><div>'+quiz.options.map(function(o,i){return'<button class="btn option" data-choice="'+i+'" data-answer="'+quiz.answer+'" data-explanation="'+esc(quiz.explanation||'')+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>'}).join('')+'</div><div id="quizFeedback" class="feedback" aria-live="polite"></div>':'<p class="muted">暂无题目</p>';
    document.getElementById('cardDetail').innerHTML='<div class="read-progress"><span style="width:'+((index+1)/cards.length*100)+'%"></span></div><div class="grid reader-grid"><article class="panel card-reading"><div class="eyebrow">第 '+esc(c.position)+' / '+cards.length+' 张 · '+esc(c.estimated_minutes)+' 分钟 · '+esc(learningChars(content))+' 字</div><h1>'+esc(content.title||c.learning_objective)+'</h1><div class="objective"><strong>学完你应该能：</strong><br>'+esc(c.learning_objective)+'</div><div class="reading-guide"><span>内容在下方完整展开，继续向下阅读</span>'+jumps+'</div><div id="readingBody">'+renderReading(content)+'</div><details class="evidence" id="evidenceBlock" open><summary>查看事实与原文证据</summary>'+renderEvidence(content)+'</details><div class="card-flow">'+previous+next+'</div></article><aside class="panel quiz-panel" id="quizBlock"><div class="eyebrow">随堂任务 · 阅读后完成</div>'+quizHtml+'<div class="actions"><button class="btn primary" id="completeCard">完成这张卡</button></div></aside></div>';
    show('card');bindDynamic()
  }
  document.getElementById('backToPack').addEventListener('click',function(){renderPack();show('pack')});
  function bindDynamic(){document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){show(b.dataset.go)}});document.querySelectorAll('[data-open-pack]').forEach(function(b){b.onclick=function(){openPack(b.dataset.openPack)}});document.querySelectorAll('[data-plan-source]').forEach(function(b){b.onclick=function(){var goal=(state.goals||[]).find(function(g){return g.status==='active'})||(state.goals||[]).find(function(g){return g.status!=='archived'&&g.status!=='completed'});if(!goal){alert('请先建立一个学习目标');return}var label=b.textContent;b.disabled=true;b.textContent='正在规划…';post('/api/v2/packs/plan',{goal_id:goal.id,source_ids:[b.dataset.planSource]}).then(function(d){if(d.error){b.disabled=false;b.textContent=label;alert(d.error);return}location.href=packUrl(d.pack.id)})}});document.querySelectorAll('[data-process-source]').forEach(function(b){b.onclick=function(){var label=b.textContent;b.disabled=true;b.textContent='正在抓取与核验…';post('/api/v2/sources/process',{source_id:b.dataset.processSource}).then(function(d){if(d.error)alert(d.error);loadLibrary()}).catch(function(){b.disabled=false;b.textContent=label})}});document.querySelectorAll('[data-open-card]').forEach(function(b){b.onclick=function(){openCard(Number(b.dataset.openCard))}});document.querySelectorAll('[data-jump]').forEach(function(b){b.onclick=function(){document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'})}});document.querySelectorAll('[data-choice]').forEach(function(b){b.onclick=function(){var ok=Number(b.dataset.choice)===Number(b.dataset.answer),explanation=b.dataset.explanation||'';document.querySelectorAll('[data-choice]').forEach(function(x){x.style.borderColor=''});b.style.borderColor=ok?'var(--ok)':'var(--danger)';document.getElementById('quizFeedback').textContent=(ok?'正确。':'再想一下。')+(explanation?' '+explanation:'')}});var bottom=document.getElementById('backToPackBottom');if(bottom)bottom.onclick=function(){renderPack();show('pack')};var complete=document.getElementById('completeCard');if(complete)complete.onclick=function(){var index=state.currentCardIndex;post('/api/v2/cards/complete',{card_id:state.currentCard.id}).then(function(d){if(d.error){alert(d.error);return}state.currentPack=d.pack;loadToday();if(index<(d.pack.cards||[]).length-1){openCard(index+1)}else{renderPack();show('pack')}})}}
  function renderProgress(){get('/api/v2/packs').then(function(d){var cards=[];(d.packs||[]).forEach(function(p){(p.cards||[]).forEach(function(c){if(c.learning_state)cards.push(c)})});document.getElementById('progressContent').className='';document.getElementById('progressContent').innerHTML=cards.length?cards.map(function(c){return'<div class="goal-row"><div><strong>'+esc(c.learning_objective)+'</strong><div class="muted">'+(c.learning_state.next_review_at?'下次验证 '+esc(c.learning_state.next_review_at):'无需长期复习')+'</div></div><span class="status">已学习</span></div>'}).join(''):'<div class="empty">完成学习包后，这里会显示已学习和待验证目标。</div>'})}
  document.querySelector('[data-page="progress"]').addEventListener('click',renderProgress);
  loadToday();loadGoals();loadLibrary();
  try{var direct=new URLSearchParams(location.search),directPack=direct.get('pack'),directCard=direct.get('card'),directPage=direct.get('page');if(directPack){openPack(directPack,directCard===null?null:Number(directCard))}else if(directPage){show(directPage);if(directPage==='goals')loadGoals()}}catch(e){}
})();
</script>
</body>
